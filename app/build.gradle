apply plugin: 'com.android.application'

repositories {
    //noinspection JcenterRepositoryObsolete
    jcenter {
        content {
            includeVersion "mobi.upod", "time-duration-picker", "1.1.3"
        }
    }
}

// ---------- Version: edit version.properties (no git needed) ----------
def versionProps = new Properties()
def versionPropsFile = rootProject.file('version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = (versionProps.getProperty('VERSION_CODE', '1')).toInteger()
def appVersionName = versionProps.getProperty('VERSION_NAME', '1.0')

// ---------- Release signing: edit keystore.properties (never commit it) ----------
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropsFile.exists()
if (hasKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}



android {
    compileSdk 35
    buildToolsVersion = '35.0.0'
    defaultConfig {
        applicationId "com.nijatva.workspace"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile', 'mywork-release.jks'))
                storePassword keystoreProps.getProperty('storePassword', '')
                keyAlias keystoreProps.getProperty('keyAlias', 'mywork')
                keyPassword keystoreProps.getProperty('keyPassword', '')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    applicationVariants.all { variant ->
        if (variant.name == "debug") {
            variant.outputs.each { o -> o.versionCodeOverride = System.currentTimeSeconds() }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint {
        disable 'MissingTranslation', 'ExtraTranslation', 'GoogleAppIndexingWarning', 'InvalidFragmentVersionForActivityResult'
    }
    buildFeatures {
        aidl true
    }
    namespace 'com.nijatva.workspace'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.legacy:legacy-support-core-ui:1.0.0'
    implementation 'androidx.fragment:fragment:1.8.4'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.google.zxing:core:3.5.3'
    debugImplementation project(path: ':setup-wizard-lib', configuration: 'gingerbreadCompatDebugRuntimeElements')
    releaseImplementation project(path: ':setup-wizard-lib', configuration: 'gingerbreadCompatReleaseRuntimeElements')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.0-alpha04'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.0-alpha01'
}

// ---------------------------------------------------------------------------
// Nijatva no-GMS guard — mirrors the defaults of github.com/nijatva/no-gms-check
// (banned groups + transitive check). When that plugin is published to a
// repository, replace this block with:
//     plugins { id("in.nijatva.no-gms-check") version "0.1.0" }
// ---------------------------------------------------------------------------
def bannedGmsGroups = [
        'com.google.android.gms', 'com.google.firebase', 'com.google.android.play',
        'com.google.android.ads', 'com.google.android.tagmanager',
        'com.crashlytics.sdk.android', 'com.google.ads.mediation']

tasks.register('checkNoGms') {
    group = 'verification'
    description = 'Fails if Google Play Services or Firebase is on the app classpath.'
    doLast {
        def violations = [] as Set
        ['releaseRuntimeClasspath', 'debugRuntimeClasspath'].each { cfgName ->
            def cfg = configurations.findByName(cfgName)
            if (cfg != null) {
                cfg.incoming.resolutionResult.allComponents.each { c ->
                    def id = c.id.displayName
                    if (bannedGmsGroups.any { id.startsWith(it + ':') }) violations << id
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException('no-GMS check failed: ' + violations.join(', '))
        }
        println 'no-GMS check passed: no Play Services or Firebase on the classpath.'
    }
}
tasks.named('check') { dependsOn 'checkNoGms' }
